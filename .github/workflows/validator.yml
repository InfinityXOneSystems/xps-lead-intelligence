# TAP Protocol: Policy > Authority > Truth
# CI Validator workflow for xps-lead-intelligence.
# Secrets must be supplied via GitHub Secrets — never committed to the repository.
#
# This workflow uses real service containers for Postgres and Redis.
# No dummy DSNs or mocks — only real services.
#
# Required secrets for full validation against Railway:
#   VALIDATOR_DATABASE_URL   — Real PostgreSQL connection string
#   VALIDATOR_REDIS_URL      — Real Redis connection string
#
# Networking note: VALIDATOR_DATABASE_URL must use the Railway public hostname
# when running on GitHub-hosted runners (ubuntu-latest). Internal Railway hostnames
# (*.railway.internal, e.g. postgres-rf1t.railway.internal) are only reachable
# from self-hosted runners inside Railway's private network.
#
# To use Railway internal hostnames, change runs-on to:
#   runs-on: [self-hosted, railway-runner]
#
# See docs/RAILWAY_SETUP.md for full provisioning and networking instructions.

name: Validator

on:
  pull_request:
  push:
    branches:
      - main

env:
  NODE_VERSION: "20"

jobs:
  validate:
    name: Validator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NODE_ENV: test

    # Real service containers — actual Postgres and Redis instances (not mocks)
    # Used when VALIDATOR_DATABASE_URL / VALIDATOR_REDIS_URL secrets are not set.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_validate
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci_validate"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Export real service connection strings
        run: |
          # Use Railway secrets if available, otherwise fall back to the
          # real ephemeral service containers started above.
          if [[ -n "${{ secrets.VALIDATOR_DATABASE_URL }}" ]]; then
            echo "DATABASE_URL=${{ secrets.VALIDATOR_DATABASE_URL }}" >> $GITHUB_ENV
            echo "Using VALIDATOR_DATABASE_URL from GitHub Secret (Railway real DB)"
          else
            echo "DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/ci_validate" >> $GITHUB_ENV
            echo "Using ephemeral Postgres service container"
          fi

          if [[ -n "${{ secrets.VALIDATOR_REDIS_URL }}" ]]; then
            echo "REDIS_URL=${{ secrets.VALIDATOR_REDIS_URL }}" >> $GITHUB_ENV
            echo "Using VALIDATOR_REDIS_URL from GitHub Secret (Railway real Redis)"
          else
            echo "REDIS_URL=redis://127.0.0.1:6379" >> $GITHUB_ENV
            echo "Using ephemeral Redis service container"
          fi

      - name: Wait for real services to be ready
        run: |
          echo "Installing DB clients..."
          sudo apt-get update -y -q
          sudo apt-get install -y -q postgresql-client redis-tools

          echo "Waiting for Postgres..."
          READY=0
          for i in $(seq 1 20); do
            pg_isready -h 127.0.0.1 -p 5432 -U ci -d ci_validate && READY=1 && break || true
            sleep 3
          done
          if [[ "${READY}" -ne 1 ]]; then
            echo "::error::Postgres service container did not become ready after 20 attempts."
            exit 1
          fi

          echo "Waiting for Redis..."
          READY=0
          for i in $(seq 1 20); do
            redis-cli -h 127.0.0.1 -p 6379 ping && READY=1 && break || true
            sleep 1
          done
          if [[ "${READY}" -ne 1 ]]; then
            echo "::error::Redis service container did not become ready after 20 attempts."
            exit 1
          fi

          echo "Services ready."
        # Note: if VALIDATOR_DATABASE_URL points to Railway, skip pg_isready for that host
        # The Railway DB is assumed healthy. Service container health is confirmed above.

      - name: Validate TypeScript compilation
        working-directory: backend
        run: npx tsc --noEmit

      - name: Validate ESLint
        working-directory: backend
        run: npm run lint

      - name: Validate Kernel Runtime
        working-directory: backend
        run: ./node_modules/.bin/jest --testPathPatterns="kernel" --passWithNoTests --forceExit

      - name: Validate Worker System
        working-directory: backend
        run: ./node_modules/.bin/jest --testPathPatterns="worker" --passWithNoTests --forceExit

      - name: Validate Full Test Suite
        working-directory: backend
        run: npm test

      - name: Upload Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validator-coverage
          path: backend/coverage/
          if-no-files-found: ignore

      - name: Validate Database Schema
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npx prisma validate

      - name: Check required service files
        run: |
          echo "Checking required service files..."
          MISSING=0
          for f in \
            backend/src/services/kernel.ts \
            backend/src/services/worker.ts \
            backend/src/services/ccp.ts \
            backend/src/services/orchestrator.ts \
            backend/src/services/redis.ts \
            backend/src/services/groq.ts \
            backend/src/services/scraper.ts \
            backend/prisma/schema.prisma \
            backend/src/index.ts; do
            if [[ ! -f "${f}" ]]; then
              echo "MISSING: ${f}"
              MISSING=1
            else
              echo "OK: ${f}"
            fi
          done
          exit ${MISSING}

      - name: Check required API route files
        run: |
          echo "Checking required API route files..."
          MISSING=0
          for f in \
            backend/src/routes/agent.ts \
            backend/src/routes/leads.ts \
            backend/src/routes/connectors.ts \
            backend/src/routes/admin.ts \
            backend/src/routes/github.ts \
            backend/src/routes/xps.ts \
            backend/src/routes/email.ts \
            backend/src/routes/social.ts \
            backend/src/routes/outreach.ts \
            backend/src/routes/auth.ts; do
            if [[ ! -f "${f}" ]]; then
              echo "MISSING: ${f}"
              MISSING=1
            else
              echo "OK: ${f}"
            fi
          done
          exit ${MISSING}

      - name: Check governance docs
        run: |
          echo "Checking governance docs..."
          MISSING=0
          for f in \
            docs/DEPLOYMENT.md \
            docs/ARCHITECTURE_CONTRACT.md \
            docs/GOVERNOR.md \
            docs/RUNBOOK.md; do
            if [[ ! -f "${f}" ]]; then
              echo "MISSING: ${f}"
              MISSING=1
            else
              echo "OK: ${f}"
            fi
          done
          exit ${MISSING}

      - name: Validator summary
        if: always()
        run: |
          echo "## Validator Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All validation steps completed. See job logs for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "For Railway infrastructure setup, see [docs/RAILWAY_SETUP.md](docs/RAILWAY_SETUP.md)." >> $GITHUB_STEP_SUMMARY
