name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Lint Frontend
        working-directory: frontend
        run: npm ci && npm run lint
      - name: Lint Backend
        working-directory: backend
        run: npm ci && npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Backend
        working-directory: backend
        run: npm ci
      - name: TypeCheck Backend
        working-directory: backend
        run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    env:
      JWT_SECRET: test-secret-for-ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Backend
        working-directory: backend
        run: npm ci
      - name: Run Unit Tests
        working-directory: backend
        run: npm test
      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage/
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Build Backend
        working-directory: backend
        run: npm ci && npm run build
      - name: Build Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || '' }}
        run: |
          export NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-http://localhost:4000}"
          npm ci && npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint]
    # Only run e2e on push to main (not PRs) to save CI time
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: xps_leads_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Backend
        working-directory: backend
        run: npm ci
      - name: Run Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/xps_leads_test
        run: npx prisma migrate deploy
      - name: Start Backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/xps_leads_test
          REDIS_URL: redis://localhost:6379
          PORT: 4000
          NODE_ENV: test
          GROQ_API_KEY: test_key
          JWT_SECRET: test_secret_for_e2e
        run: npm start &
      - name: Install Frontend
        working-directory: frontend
        run: npm ci
      - name: Build Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build
      - name: Start Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm start &
      - name: Wait for services
        run: |
          timeout 30 bash -c 'until curl -sf http://localhost:4000/api/health; do sleep 2; done' || echo "Backend not ready"
          timeout 30 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done' || echo "Frontend not ready"
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run E2E Tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:3000
        run: npx playwright test
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RAILWAY_PROJECT_ID: 0361239a-54f7-4db8-8350-d7931d2b9260
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy Backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            railway up --service backend --detach --project ${{ env.RAILWAY_PROJECT_ID }}
          else
            echo "⚠️ RAILWAY_TOKEN not set — skipping deployment. Add it to repo secrets."
          fi
      - name: Deploy Frontend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            railway up --service frontend --detach --project ${{ env.RAILWAY_PROJECT_ID }}
          else
            echo "⚠️ RAILWAY_TOKEN not set — skipping deployment. Add it to repo secrets."
          fi
