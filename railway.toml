[build]
builder = "nixpacks"

[[services]]
name = "backend"
source = "backend"

  [services.build]
  buildCommand = "npm ci && npm run build && npx prisma generate"

  [services.deploy]
  startCommand = "npm start"
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 3

  [services.variables]
  PORT = "4000"
  NODE_ENV = "production"

[[services]]
name = "frontend"
source = "frontend"

  [services.build]
  buildCommand = "npm ci && npm run build"

  [services.deploy]
  startCommand = "npm start"
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 3

  [services.variables]
  PORT = "3000"
  NODE_ENV = "production"
